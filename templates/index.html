      font-weight: bold;
      background: #e9ecef;
      padding: 10px;
      border-radius: 8px;

      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.06);
      border-left: 5px solid var(--primary);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .badge {
      padding: 4px 12px;
      border-radius: 12px;
      color: #fff;
      font-size: 0.85rem;
      font-weight: bold;
      text-transform: uppercase;
      background-color: var(--easy);
    }

    .question-title {
      font-size: 1.05rem;
      font-weight: 600;
    }

    pre {
      background-color: #1e1e1e;
      color: #d4d4d4;
      padding: 15px;
      border-radius: 8px;
      overflow-x: auto;
      font-family: 'Consolas', 'Courier New', Courier, monospace;
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 15px;
    }

    input.blank {
      background-color: #2d2d2d;
      border: 2px solid #4ec9b0;
      color: #ce9178;
      font-family: inherit;
      font-size: inherit;
      padding: 2px 8px;
      border-radius: 4px;
      min-width: 70px;
      max-width: 150px;
      text-align: center;
      font-weight: bold;
    }

    input.blank:focus {
      outline: none;
      border-color: #9cdcfe;
      box-shadow: 0 0 5px rgba(156, 220, 254, 0.5);
    }

    .actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    button {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 8px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: var(--primary-hover);
    }

    .feedback {
      font-weight: bold;
      padding: 6px 14px;
      border-radius: 6px;
      display: none;
      font-size: 0.95rem;
    }

    .feedback.correct {
      display: inline-block;
      color: #ffffff;
      background-color: var(--success);
    }

    .feedback.incorrect {
      display: inline-block;
      color: #ffffff;
      background-color: var(--error);
    }

    ];

    let correctSet = new Set();
    document.getElementById("total-count").textContent = questions.length;

    function renderQuiz() {
      const container = document.getElementById("quiz-container");

      questions.forEach((q, qIndex) => {
        const card = document.createElement("div");
        card.className = "quiz-card";

        let answerCounter = 0;
        const formattedCode = q.code.replace(/___/g, () => {
          const inputHtml = `<input type="text" class="blank" data-q="${qIndex}" data-a="${answerCounter}" autocomplete="off" spellcheck="false">`;
          answerCounter++;
          return inputHtml;
        });

        card.innerHTML = `
          <div class="card-header">
            <span class="question-title">${q.title}</span>
            <span class="badge">${q.difficulty}</span>
          </div>
          <pre><code>${formattedCode}</code></pre>
          <div class="actions">
            <button onclick="checkAnswer(${qIndex})">Verificar</button>
            <span id="feedback-${qIndex}" class="feedback"></span>
          </div>
        `;

        container.appendChild(card);
      });
    }

    function checkAnswer(questionIndex) {
      const q = questions[questionIndex];
      const inputs = document.querySelectorAll(`input[data-q="${questionIndex}"]`);
      const feedbackEl = document.getElementById(`feedback-${questionIndex}`);
      
      let allCorrect = true;

      inputs.forEach((input) => {
        const answerIndex = parseInt(input.getAttribute("data-a"));
        const userAnswer = input.value.trim();
        const expectedAnswer = q.answers[answerIndex];

        if (userAnswer !== expectedAnswer) {
          allCorrect = false;
        }
      });

      if (allCorrect) {
        feedbackEl.textContent = "✓ Correto!";
        feedbackEl.className = "feedback correct";
        correctSet.add(questionIndex);
      } else {
        feedbackEl.textContent = "✗ Tente novamente";
        feedbackEl.className = "feedback incorrect";
        correctSet.delete(questionIndex);
      }

      document.getElementById("correct-count").textContent = correctSet.size;
    }

    renderQuiz();
  </script>
